<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page introuvable · Nexploria</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f2ed">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/syne-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Syne';src:url('/fonts/syne-var.woff2') format('woff2');font-weight:700 800;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('/fonts/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('/fonts/ibm-plex-mono-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
:root{--bg:#f4f2ed;--ink:#111010;--muted:#625f58;--red:#d63f0e;--red-text:#b8350a;--border:#d6d2c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:0.08;pointer-events:none;z-index:0}
.content{position:relative;z-index:1;max-width:500px}
.code{font-size:clamp(4rem,15vw,8rem);font-family:'Syne',sans-serif;font-weight:800;line-height:1;letter-spacing:-0.05em;color:var(--ink);margin-bottom:1rem}
.code span{color:var(--red-text)}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-0.02em;margin-bottom:0.75rem}
p{font-size:0.82rem;color:var(--muted);line-height:1.7;margin-bottom:2rem}
.links{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0.6rem 1.25rem;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none;border-radius:3px;transition:background 0.15s,transform 0.12s}
.btn-primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.btn-primary:hover{background:var(--red);border-color:var(--red);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn-ghost:hover{background:#e8e5de;transform:translateY(-2px)}
.suggest{margin-top:2.5rem;padding-top:2rem;border-top:1px solid var(--border)}
.suggest-label{font-weight:400;font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.suggest-grid{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap}
.suggest-chip{padding:0.3rem 0.75rem;border:1px solid var(--border);border-radius:100px;font-size:0.7rem;text-decoration:none;color:var(--muted);transition:color 0.15s,border-color 0.15s}
.suggest-chip:hover{color:var(--red-text);border-color:var(--red-text)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main class="content">
  <div class="code" aria-hidden="true">4<span>0</span>4</div>
  <h1>Cette page est introuvable.</h1>
  <p>L'expérience que vous cherchez n'existe peut-être pas encore, ou son adresse a changé. Revenez à l'accueil pour explorer les 100 simulations disponibles.</p>
  <div class="links">
    <a href="/" class="btn btn-primary">Retour à l'accueil <span aria-hidden="true">→</span></a>
    <a href="/#experiences" class="btn btn-ghost">Voir les expériences</a>
  </div>
  <nav class="suggest" aria-labelledby="suggest-label">
    <h2 class="suggest-label" id="suggest-label">Suggestions</h2>
    <div class="suggest-grid">
      <a href="/experience/mandelbrot" class="suggest-chip">Mandelbrot</a>
      <a href="/experience/lorenz" class="suggest-chip">Lorenz</a>
      <a href="/experience/conway" class="suggest-chip">Conway</a>
      <a href="/experience/turing" class="suggest-chip">Turing</a>
      <a href="/experience/fourier" class="suggest-chip">Fourier</a>
    </div>
  </nav>
</main>
<script data-src="/js/404.js">
/* Chargeur : seul script inline, autorisé par son empreinte SHA-256 dans la CSP (_headers).
   Il ne change jamais : modifiez /js/*.js librement, sans toucher à la CSP. */
(function (me) {
  var tt = window.trustedTypes;
  var policy = tt && tt.createPolicy ? tt.createPolicy('nexploria-loader', {
    createScriptURL: function (u) { if (/^\/js\/[\w.-]+\.js$/.test(u)) return u; throw new TypeError('Script refusé : ' + u); }
  }) : null;
  var s = document.createElement('script');
  s.src = policy ? policy.createScriptURL(me.getAttribute('data-src')) : me.getAttribute('data-src');
  document.body.appendChild(s);
})(document.currentScript);
</script>
</body>
</html>
